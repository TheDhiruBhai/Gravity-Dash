name: Build Gravity Drift Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build StandaloneWindows64 (IL2CPP)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-6000.6.11f1-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-6000.6.11f1-StandaloneWindows64-

      - name: Build Unity project (StandaloneWindows64)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: 6000.6.11f1
          customImage: unityci/editor:windows-6000.6.11f1-windows-il2cpp-4.0
          buildName: GravityDrift
          customParameters: -nographics

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityDrift-Windows64
          path: build/StandaloneWindows64/
          retention-days: 5
